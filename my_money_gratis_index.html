<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8dce7"><title>My Money ♡</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8fb;color:#392535;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{max-width:520px;margin:auto;padding:24px 18px 95px}h1{font-size:30px;margin:4px 0}h2{font-size:19px}small,.muted{color:#896e7c}.eyebrow{font-size:11px;letter-spacing:2px;color:#a25b7b;font-weight:800}.card{background:white;border:1px solid #f0dce5;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 4px 16px #ab65820b}.hero{background:#fce6ee}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff;border-radius:14px;padding:12px}.metric b{display:block;font-size:23px;margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eed7e1;display:flex;justify-content:center;padding:9px 5px max(12px,env(safe-area-inset-bottom));z-index:5}.tabs button{width:33%;max-width:170px;background:none;color:#866775;border:0;font-size:13px;padding:8px}.tabs button.active{color:#a6356b;font-weight:800}.btn{background:#b34478;color:white;border:0;border-radius:13px;padding:13px 16px;font-size:15px;font-weight:700;width:100%;cursor:pointer}.ghost{background:#fce8f0;color:#973e68}.danger{color:#b33e59;background:none;border:0;padding:8px}label{display:block;font-size:13px;font-weight:700;margin:13px 0 5px}input,select{width:100%;border:1px solid #e6cbd8;background:#fff;border-radius:12px;padding:12px;font-size:16px;color:#392535}input[type=range]{padding:0;accent-color:#b34478}.progress{height:12px;background:#f2e1e9;border-radius:20px;overflow:hidden}.fill{height:100%;background:#b34478;transition:width .2s}.item{padding:12px 0;border-bottom:1px solid #f4e6ed}.item:last-child{border:0}.hidden{display:none}.pill{display:inline-block;background:#fbe4ed;border-radius:15px;padding:5px 9px;color:#9b4b70;font-size:12px}.preview{width:100%;max-height:240px;object-fit:contain;border-radius:12px;margin-top:10px}.notice{background:#fff1d9;padding:12px;border-radius:12px;color:#735126;font-size:13px} .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><main class="app"><div class="eyebrow">MY MONEY ♡</div><h1>Tu dinero, bajo control</h1><p class="muted">Turnos reales → presupuesto de la semana siguiente.</p><section id="home"></section><section id="turnos" class="hidden"></section><section id="gastos" class="hidden"></section></main><nav class="tabs"><button data-tab="home" class="active">♡ Resumen</button><button data-tab="turnos">▤ Turnos</button><button data-tab="gastos">◉ Gastos</button></nav><script>
const KEY='mymoney_turnos_v1';const defaults={shifts:[],expenses:[],rate:18.25,save:50,tax:12,fixed:0,goal:10000,startingSavings:1200};let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...defaults}};let tab='home',photo='',detected='';const $=id=>document.getElementById(id),money=n=>'$'+(Number(n)||0).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2}),num=n=>Number(n)||0;function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function weekStart(d){let x=new Date(d+'T12:00:00');x.setDate(x.getDate()-(x.getDay()+6)%7);return x.toISOString().slice(0,10)}function shiftIncome(s){return num(s.tips)+num(s.hours)*num(state.rate)}function weekIncome(w){return state.shifts.filter(s=>weekStart(s.date)===w).reduce((a,s)=>a+shiftIncome(s),0)}function weekExpenses(w){return state.expenses.filter(s=>weekStart(s.date)===w).reduce((a,s)=>a+num(s.amount),0)}function previous(w){let d=new Date(w+'T12:00:00');d.setDate(d.getDate()-7);return d.toISOString().slice(0,10)}function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function budgetFor(w){let inc=weekIncome(previous(w));let tax=state.shifts.filter(s=>weekStart(s.date)===previous(w)).reduce((a,s)=>a+num(s.hours)*num(state.rate),0)*num(state.tax)/100;let afterTax=Math.max(0,inc-tax);return {inc,tax,save:afterTax*num(state.save)/100,fixed:0,budget:Math.max(0,afterTax*(1-num(state.save)/100))}}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let w=weekStart(today()),b=budgetFor(w),spent=weekExpenses(w),remain=b.budget-spent,prev=previous(w),thisInc=weekIncome(w);$('home').innerHTML=`<div class="card hero"><div class="eyebrow">PRESUPUESTO DE ESTA SEMANA</div><h1>${money(b.budget)}</h1><div class="grid"><div class="metric"><small>Gastado</small><b>${money(spent)}</b></div><div class="metric"><small>Te queda</small><b style="color:${remain<0?'#bd3855':'#38836c'}">${money(remain)}</b></div></div><p><div class="progress"><div class="fill" style="width:${b.budget?Math.min(100,spent/b.budget*100):0}%"></div></div></p><small>Calculado con los turnos de la semana anterior (${prev}).</small></div><div class="card"><h2>Esta semana estás ganando</h2><h1>${money(thisInc)}</h1><small>Este dinero definirá tu presupuesto de la próxima semana.</small><div class="row" style="margin-top:15px"><span>Próximo presupuesto estimado</span><b>${money(budgetForNext(w))}</b></div></div><div class="card"><h2>Tu meta de ahorro ♡</h2><div class="row"><span>Ahorrado inicialmente</span><b>${money(state.startingSavings)}</b></div><div class="row"><span>Meta para el 1 de enero</span><b>${money(state.goal)}</b></div><div class="progress" style="margin:14px 0"><div class="fill" style="width:${Math.min(100,state.startingSavings/state.goal*100)}%"></div></div><div class="row"><span>Te falta</span><b>${money(Math.max(0,state.goal-state.startingSavings))}</b></div><small>El ahorro inicial es dinero confirmado. El ahorro de tus futuros turnos es una proyección, no se añade automáticamente a tus ahorros reales.</small><label>Mis ahorros reales ($)</label><input id="initial" type="number" min="0" step=".01" value="${state.startingSavings}"><button class="btn ghost" style="margin-top:10px" onclick="state.startingSavings=num($('initial').value);save()">Actualizar ahorros</button></div><div class="card"><h2>Mis categorías esta semana</h2><p class="muted">Cada gasto que registres actualiza estos saldos al instante.</p>${categoryCards(w,b.budget)}</div><div class="card"><h2>Cómo se calcula</h2><div class="row"><span>Ingresos semana anterior</span><b>${money(b.inc)}</b></div><div class="row"><span>Reserva estimada impuestos</span><b>−${money(b.tax)}</b></div><div class="row"><span>Ahorro (${state.save}%)</span><b>−${money(b.save)}</b></div><hr style="border:0;border-top:1px solid #f1dce5"><div class="row"><b>Para gastar</b><b>${money(b.budget)}</b></div><label>Porcentaje de ahorro: <span id="pct">${state.save}%</span></label><input type="range" min="0" max="85" step="5" value="${state.save}" oninput="$('pct').textContent=this.value+'%'" onchange="state.save=num(this.value);save()"><div class="two"><div><label>Sueldo por hora ($)</label><input type="number" min="0" step=".01" id="rate" value="${state.rate}"></div><div><label>Reserva impuestos sobre sueldo (%)</label><input type="number" min="0" max="60" id="tax" value="${state.tax}"></div></div><button class="btn ghost" style="margin-top:12px" onclick="state.rate=num($('rate').value);state.tax=num($('tax').value);save()">Actualizar ajustes</button><p class="muted" style="font-size:12px">Los impuestos son una reserva configurable, no un cálculo fiscal exacto. Registra tus pagos en la pestaña Gastos para que se descuenten del saldo disponible.</p></div>`;
$('turnos').innerHTML=`<div class="card"><h2>Agregar turno ♡</h2><p class="muted">Selecciona una foto: intentaremos leer A/R TOTAL de inmediato. Confirma siempre el monto antes de guardar.</p><label>Foto del papel</label><input id="photo" type="file" accept="image/*" onchange="loadPhoto(this)"><div id="photoarea"></div><div class="notice" id="ocrstatus">La lectura automática requiere conexión y puede fallar. También puedes escribir las propinas manualmente.</div><label>Fecha del turno</label><input id="sdate" type="date" value="${today()}"><div class="two"><div><label>Propinas A/R TOTAL ($)</label><input id="tips" type="number" min="0" step=".01" placeholder="219.83"></div><div><label>Horas trabajadas</label><input id="hours" type="number" min="0" max="24" step=".25" placeholder="5"></div></div><button class="btn" style="margin-top:16px" onclick="addShift()">Guardar turno</button></div><div class="card"><h2>Mis turnos</h2>${state.shifts.length?state.shifts.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<div class="item row"><div><b>${esc(s.date)}</b><div class="muted">${num(s.hours)} h · propinas ${money(s.tips)}</div><b>${money(shiftIncome(s))}</b></div><button class="danger" onclick="removeShift('${s.id}')">Eliminar</button></div>`).join(''):'<p class="muted">Todavía no has agregado turnos.</p>'}</div>`;
$('gastos').innerHTML=`<div class="card"><h2>Importar gastos de una captura ♡</h2><p class="muted">Selecciona una captura de tus movimientos bancarios. Se leerán automáticamente todos los días visibles; revisa los resultados antes de guardar.</p><input type="file" accept="image/*" onchange="readBankPhoto(this)"><div id="bankscan"></div></div><div class="card"><h2>Registrar gasto</h2><label>Fecha</label><input id="edate" type="date" value="${today()}"><label>Categoría</label><select id="category"><option>Uber / Lyft</option><option>Cafés</option><option>Restaurantes</option><option>Supermercado</option><option>Compras</option><option>Salidas</option><option>Servicios y suscripciones</option><option>Renta / vivienda</option><option>UBC / estudios</option><option>Salud</option><option>Otros</option></select><label>Monto ($)</label><input id="amount" type="number" min="0" step=".01" placeholder="8.50"><label>Nota (opcional)</label><input id="note" placeholder="Ej. Uber a UBC"><button class="btn" style="margin-top:16px" onclick="addExpense()">Guardar gasto</button></div><div class="card"><h2>Disponible por categoría</h2>${categoryCards(w,b.budget)}<h2>Gastos de esta semana</h2>${expenseBreakdown(w)}<button class="btn ghost" style="margin:14px 0" onclick="exportData()">Descargar copia de mis registros</button><h2>Historial</h2>${state.expenses.length?state.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="item row"><div><b>${esc(e.category)} · ${money(e.amount)}</b><div class="muted">${esc(e.date)} ${esc(e.note)}</div></div><button class="danger" onclick="removeExpense('${e.id}')">Eliminar</button></div>`).join(''):'<p class="muted">Todavía no has agregado gastos.</p>'}</div>`;for(let t of ['home','turnos','gastos']){$(t).classList.toggle('hidden',tab!==t);document.querySelector(`[data-tab="${t}"]`).classList.toggle('active',tab===t)}}function budgetForNext(w){let inc=weekIncome(w),sal=state.shifts.filter(s=>weekStart(s.date)===w).reduce((a,s)=>a+num(s.hours)*num(state.rate),0);return Math.max(0,(inc-sal*num(state.tax)/100)*(1-num(state.save)/100))}const categoryWeights={"Supermercado":.30,"Restaurantes":.15,"Cafés":.10,"Uber / Lyft":.15,"Compras":.10,"Salidas":.10,"Otros":.10};function categoryCards(w,budget){let cats=[...Object.keys(categoryWeights),"Servicios y suscripciones","Renta / vivienda","UBC / estudios","Salud"];return cats.map(c=>{let spent=state.expenses.filter(e=>weekStart(e.date)===w&&e.category===c).reduce((a,e)=>a+num(e.amount),0),allocation=budget*(categoryWeights[c]||0),left=allocation-spent;return `<div class="item"><div class="row"><b>${esc(c)}</b><span style="color:${left<0?'#b33e59':'#38836c'}">${categoryWeights[c]?money(left)+' restante':money(spent)+' gastado'}</span></div><small>${categoryWeights[c]?money(spent)+' de '+money(allocation)+' asignados': 'Sin límite propio; se descuenta del total semanal'}</small>${categoryWeights[c]?`<div class="progress" style="height:7px;margin-top:7px"><div class="fill" style="width:${allocation?Math.min(100,spent/allocation*100):0}%"></div></div>`:''}</div>`}).join('')}function expenseBreakdown(w){let cats={};for(let e of state.expenses.filter(e=>weekStart(e.date)===w))cats[e.category]=(cats[e.category]||0)+num(e.amount);return Object.entries(cats).map(([c,n])=>`<div class="row item"><span>${esc(c)}</span><b>${money(n)}</b></div>`).join('')||'<p class="muted">Sin gastos registrados esta semana.</p>'}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-money-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function addShift(){let date=$('sdate').value,tips=$('tips').value,hours=$('hours').value;if(!date||tips===''||hours===''||num(tips)<0||num(hours)<=0){alert('Ingresa fecha, propinas y horas válidas.');return}state.shifts.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date,tips:num(tips),hours:num(hours)});photo='';save()}function addExpense(){let date=$('edate').value,amount=$('amount').value;if(!date||amount===''||num(amount)<=0){alert('Ingresa fecha y monto válido.');return}state.expenses.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date,amount:num(amount),category:$('category').value,note:$('note').value});save()}function removeShift(id){if(confirm('¿Eliminar este turno?')){state.shifts=state.shifts.filter(s=>s.id!==id);save()}}function removeExpense(id){if(confirm('¿Eliminar este gasto?')){state.expenses=state.expenses.filter(s=>s.id!==id);save()}}let ocrRun=0;
async function loadPhoto(input){
 const f=input.files?.[0];if(!f)return;
 const run=++ocrRun;
 const url=URL.createObjectURL(f);
 $('photoarea').innerHTML='';const img=document.createElement('img');img.className='preview';img.alt='Foto del cashout slip';img.src=url;$('photoarea').appendChild(img);
 $('ocrstatus').textContent='Analizando foto automáticamente…';
 try{await readSlip(f,run)}finally{setTimeout(()=>URL.revokeObjectURL(url),60000)}
}
function parseMoney(text){let m=[...text.matchAll(/(?:\$\s*)?(\d{1,4})[.,](\d{2})/g)];return m.map(x=>Number(x[1]+'.'+x[2])).filter(n=>n>0&&n<2000)}
function extractTips(text){
 const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
 for(let i=0;i<lines.length;i++){
  if(/A\s*\/?\s*R\s*(?:TOTAL|TOT|T0T)/i.test(lines[i])){
   let nums=parseMoney(lines.slice(i,i+2).join(' '));if(nums.length)return nums[0];
  }
 }
 return null;
}
async function readSlip(file,run){
 const status=$('ocrstatus');
 try{
  if(!window.Tesseract){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
  const bitmap=await createImageBitmap(file);
  // On standard Social Corner cashout slips, A/R TOTAL sits just above the bold TOTAL box.
  // First crop the central section of the receipt, then try the full photo as fallback.
  const w=bitmap.width,h=bitmap.height;
  const candidates=[];
  for(const rect of [[.25,.22,.5,.48],[.15,.12,.7,.65],[0,0,1,1]]){
   const canvas=document.createElement('canvas');const sx=w*rect[0],sy=h*rect[1],sw=w*rect[2],sh=h*rect[3];
   const scale=Math.min(3,Math.max(1,1800/sw));canvas.width=Math.round(sw*scale);canvas.height=Math.round(sh*scale);
   const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
   candidates.push(canvas);
  }
  let result=null;
  for(let i=0;i<candidates.length;i++){
   if(run!==ocrRun)return;
   status.textContent=`Leyendo propinas automáticamente (${i+1}/3)…`;
   const output=await Tesseract.recognize(candidates[i],'eng');
   const text=output.data.text||'';
   const found=extractTips(text);
   if(found!==null){result=found;break}
  }
  bitmap.close?.();if(run!==ocrRun)return;
  if(result!==null){$('tips').value=result.toFixed(2);status.textContent='Posible A/R TOTAL: '+money(result)+'. Verifica el número antes de guardar.'}
  else{status.textContent='No logré leer A/R TOTAL con suficiente confianza. Prueba una foto más cercana, recta y bien iluminada, o escríbelo manualmente.'}
 }catch(e){if(run===ocrRun)status.textContent='No se pudo leer automáticamente. Revisa tu conexión o escribe las propinas manualmente.'}
}

let pendingBank=[];
function bankCategory(name){let t=name.toLowerCase();if(/lyft|uber|taxi|transit|compass/.test(t))return 'Uber / Lyft';if(/bakery|coffee|cafe|café|starbucks|tim hortons|blenz/.test(t))return 'Cafés';if(/dynamite|zara|aritzia|indigo|sephora|uniqlo|amazon|winners/.test(t))return 'Compras';if(/dabao|restaurant|pizza|sushi|mcdonald|chipotle|food|apos ubc/.test(t))return 'Restaurantes';if(/costco|walmart|save on|safeway|whole foods|superstore/.test(t))return 'Supermercado';if(/netflix|spotify|subscription/.test(t))return 'Servicios y suscripciones';return 'Otros'}
function parseBankOCR(text){
 let lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean),records=[],date='',lastMerchant='';
 const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
 const dateRx=/(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*[,\s]+(\d{1,2})\s+([a-z]{3})[a-z]*[,\s]+(20\d{2})/i;
 for(let i=0;i<lines.length;i++){
  let line=lines[i],d=line.match(dateRx);
  if(d){date=`${d[3]}-${String(months[d[2].toLowerCase()]).padStart(2,'0')}-${d[1].padStart(2,'0')}`;lastMerchant='';continue}
  if(/deposit|e.transfer|interac|balance|available|chequing|benefits/i.test(line)){lastMerchant='';continue}
  let merchant=line.match(/(?:Apos|Opos|POS\s+Purchase\s+)?\s*([A-Za-z][A-Za-z0-9 *.'&-]{3,})/);
  if(merchant && !/purchase|transaction|search|wed|tue|mon|thu|fri|sat|sun/i.test(merchant[1]))lastMerchant=merchant[1].trim();
  // Only accept negative values as debits. Avoid balances and positive deposits.
  let amounts=[...line.matchAll(/-\s*\$?\s*(\d{1,5})[.,](\d{2})/g)];
  for(let a of amounts){let amount=Number(a[1]+'.'+a[2]);if(!date||!amount||amount>10000)continue;
   let nearby=lines.slice(i+1,Math.min(i+4,lines.length)).find(x=>/\b(?:Apos|Opos)\b/i.test(x));
   let name=(nearby||lastMerchant||'Compra bancaria').replace(/^(?:Apos|Opos)\s*/i,'').replace(/\s+Vanco(?:uver)?\b.*$/i,'').trim();
   if(/deposit|transfer/i.test(name))continue;
   records.push({date,amount,name,category:bankCategory(name)});
  }
 }
 return records.filter((r,i,a)=>a.findIndex(x=>x.date===r.date&&x.amount===r.amount&&x.name===r.name)===i);
}
function bankReview(){let el=$('bankscan');if(!el)return;
 if(!pendingBank.length){el.innerHTML='<p class="muted">No encontré gastos con suficiente seguridad. Prueba una captura más nítida o regístralos manualmente.</p>';return}
 el.innerHTML='<p class="muted">Revisa las fechas, comercios y montos. Desmarca cualquier movimiento incorrecto.</p>'+pendingBank.map((r,i)=>`<div class="item"><label><input type="checkbox" id="bkcheck${i}" checked> Incluir movimiento ${i+1}</label><input aria-label="Fecha" type="date" id="bkdate${i}" value="${r.date}"><input aria-label="Comercio" id="bkname${i}" value="${esc(r.name)}"><input aria-label="Monto" type="number" min="0" step=".01" id="bkamount${i}" value="${r.amount}"><select id="bkcat${i}">${['Uber / Lyft','Cafés','Restaurantes','Supermercado','Compras','Salidas','Servicios y suscripciones','Renta / vivienda','UBC / estudios','Salud','Otros'].map(c=>`<option ${c===r.category?'selected':''}>${c}</option>`).join('')}</select></div>`).join('')+'<button class="btn" onclick="saveBankExpenses()">Guardar gastos seleccionados</button>';
}
function saveBankExpenses(){let added=0,skipped=0;for(let i=0;i<pendingBank.length;i++){if(!$('bkcheck'+i)?.checked)continue;let date=$('bkdate'+i).value,amount=num($('bkamount'+i).value),note=$('bkname'+i).value.trim(),category=$('bkcat'+i).value;if(!date||amount<=0){skipped++;continue}let duplicate=state.expenses.some(e=>e.date===date&&Math.abs(num(e.amount)-amount)<.001&&e.note?.toLowerCase()===note.toLowerCase());if(duplicate){skipped++;continue}state.expenses.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+i),date,amount,category,note});added++}pendingBank=[];save();alert(`${added} gastos guardados. ${skipped} omitidos o duplicados.`)}
async function readBankPhoto(input){let file=input.files?.[0];if(!file)return;let el=$('bankscan');el.textContent='Leyendo movimientos automáticamente…';try{if(!window.Tesseract){await new Promise((resolve,reject)=>{let script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';script.onload=resolve;script.onerror=reject;document.head.appendChild(script)})}let output=await Tesseract.recognize(file,'eng');pendingBank=parseBankOCR(output.data.text||'');bankReview()}catch(e){el.textContent='No se pudo analizar la captura. Comprueba la conexión e inténtalo de nuevo.'}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
